# === CASE Studio AI — Docker Compose (Producción AWS EC2) ===
services:
  # --- PostgreSQL Database ---
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-casestudio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-casestudio_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-casestudio}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-casestudio_user} -d ${POSTGRES_DB:-casestudio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- CASE Engine (Spring Boot 3 / Java 21) ---
  backend:
    image: ${DOCKER_REGISTRY:-casestudio}/case-backend:${IMAGE_TAG:-latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-casestudio}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-casestudio_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-casestudio_secret_2026}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: ${JWT_SECRET:-super_secret_case_studio_jwt_token_key_2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN_NAME}}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "127.0.0.1:8080:8080"

  # --- Web CASE Studio Frontend ---
  web:
    image: ${DOCKER_REGISTRY:-casestudio}/case-web:${IMAGE_TAG:-latest}
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"

  # --- Ollama (IA Local para Inferencia) ---
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # --- Nginx Reverse Proxy + SSL ---
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro

  # --- Certbot (SSL Let's Encrypt) ---
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "true"

volumes:
  pgdata:
  ollama_data:
  certbot_webroot:
  certbot_certs:
