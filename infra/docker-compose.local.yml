# === CASE Studio AI — Docker Compose (Desarrollo Local y Defensa Paso 4) ===
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: casestudio_user
      POSTGRES_PASSWORD: casestudio_secret_2026
      POSTGRES_DB: casestudio
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casestudio_user -d casestudio"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_local:
