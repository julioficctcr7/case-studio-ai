name: CI / Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # --- Job 1: Verificación de Calidad y Compilación ---
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Backend Build
        working-directory: backend
        run: |
          npm ci || npm install
          npm run build

  # --- Job 2: Despliegue Directo a AWS EC2 vía SSH ---
  deploy:
    name: Deploy to AWS EC2
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [AWS EC2] Iniciando despliegue de CASE Studio AI..."

            export PATH=$PATH:/usr/bin:/usr/local/bin:/usr/local/bin/docker-compose

            # Asegurar permisos sobre el socket de Docker
            sudo chmod 666 /var/run/docker.sock || true

            # Navegar a la carpeta del proyecto o clonar
            if [ -d "$HOME/case-studio-ai" ]; then
              cd "$HOME/case-studio-ai"
            else
              git clone https://github.com/julioficctcr7/case-studio-ai.git "$HOME/case-studio-ai"
              cd "$HOME/case-studio-ai"
            fi

            # Traer los últimos cambios confirmados
            git pull origin main

            # Desplegar servicios con Docker Compose en el servidor
            if [ -d "infra" ]; then
              cd infra
              export DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
              [ -z "$DOMAIN_NAME" ] && export DOMAIN_NAME="casestudio.duckdns.org"

              sudo -E docker compose down || true
              sudo -E docker compose up -d --build
            fi

            echo "✅ [AWS EC2] Despliegue en producción completado con éxito!"
