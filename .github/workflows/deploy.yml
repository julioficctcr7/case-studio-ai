name: CI / Deploy to AWS EC2

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  AWS_HOST: ${{ secrets.AWS_HOST }}
  AWS_USER: ${{ secrets.AWS_USER }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # --- Job 0: Tests & Lint (Gate de Calidad) ---
  test:
    name: Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Backend: Java 21 & Maven ---
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Test backend
        working-directory: backend
        continue-on-error: true
        run: |
          if [ -f "pom.xml" ]; then
            mvn -B test --file pom.xml
          fi

      # --- Web: Node 20 & Lint ---
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint web
        working-directory: web
        continue-on-error: true
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run lint || true
          fi

      # --- Mobile: Flutter Analyze ---
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Analyze mobile
        working-directory: mobile
        continue-on-error: true
        run: |
          if [ -f "pubspec.yaml" ]; then
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings || true
          fi

  # --- Job 1: Build y Push de Imágenes Docker (solo en push a main) ---
  build:
    name: Build & Push Docker Images
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend image
        run: |
          docker build -t $DOCKER_REGISTRY/casestudio-backend:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/casestudio-backend:latest \
                       ./backend
          docker push $DOCKER_REGISTRY/casestudio-backend:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/casestudio-backend:latest

      - name: Build & push web image
        run: |
          docker build -t $DOCKER_REGISTRY/casestudio-web:$IMAGE_TAG \
                       -t $DOCKER_REGISTRY/casestudio-web:latest \
                       ./web
          docker push $DOCKER_REGISTRY/casestudio-web:$IMAGE_TAG
          docker push $DOCKER_REGISTRY/casestudio-web:latest

  # --- Job 2: Deploy a la VM en AWS EC2 (solo en push a main) ---
  deploy:
    name: Deploy to AWS EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $AWS_HOST >> ~/.ssh/known_hosts

      - name: Copy deployment files to AWS VM
        run: |
          scp -i ~/.ssh/deploy_key \
            infra/docker-compose.yml \
            $AWS_USER@$AWS_HOST:~/case-studio-ai/

          scp -i ~/.ssh/deploy_key -r \
            infra/nginx/ \
            $AWS_USER@$AWS_HOST:~/case-studio-ai/

      - name: Deploy on AWS VM
        run: |
          ssh -i ~/.ssh/deploy_key $AWS_USER@$AWS_HOST << 'EOF'
            cd ~/case-studio-ai

            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export DOCKER_REGISTRY=${{ env.DOCKER_REGISTRY }}

            # Pull nuevas imágenes y levantar contenedores
            docker compose --env-file .env.production pull backend web
            docker compose --env-file .env.production up -d --no-deps backend web

            # Reiniciar Nginx para refrescar resolución DNS de contenedores
            docker compose --env-file .env.production restart nginx

            # Limpiar imágenes huérfanas
            docker image prune -f

            echo "Deploy completado en AWS: $IMAGE_TAG"
          EOF

      - name: Verify deployment health
        run: |
          ssh -i ~/.ssh/deploy_key $AWS_USER@$AWS_HOST << 'EOF'
            set -e
            cd ~/case-studio-ai
            echo "=== Contenedores activos en AWS ==="
            docker compose --env-file .env.production ps
            echo ""
            echo "=== Health check Backend Spring Boot ==="
            backend_ready=false
            for attempt in {1..15}; do
              if curl -sf --connect-timeout 2 --max-time 5 http://localhost:8080/actuator/health > /dev/null || curl -sf http://localhost:8080/swagger-ui.html > /dev/null; then
                backend_ready=true
                break
              fi
              echo "Esperando inicio de Spring Boot... ($attempt/15)"
              sleep 5
            done

            if [ "$backend_ready" != "true" ]; then
              echo "Backend FAIL en AWS"
              docker compose --env-file .env.production logs --tail=100 backend
              exit 1
            fi

            echo "Backend OK en AWS"
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
